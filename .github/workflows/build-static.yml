name: Build Static Export

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build static export
        run: npm run build

      - name: Upload out/ as artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/
          retention-days: 30

      - name: Create ZIP for download
        run: |
          cd out
          zip -r ../maliriprofi-static.zip .
          cd ..

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: maliriprofi-static-zip
          path: maliriprofi-static.zip
          retention-days: 30
